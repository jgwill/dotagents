# ateliers.conf — la table des ateliers. Une ligne par atelier, sept colonnes.
#
# C'est la SEULE source du vocabulaire. Les outils ne devinent rien : une valeur
# à « ? » est un TROU, et un outil qui tombe dessus refuse d'agir au lieu
# d'inventer. Remplir un « ? » est une décision de Jerry ⚡ (voie 3), pas une
# déduction d'outil.
#
# Un « * » en fin de valeur = PROPOSÉ, appuyé sur une source lue, en attente de
# la confirmation de Jerry. Les outils le lisent comme la valeur nue.
#
# L'identifiant est PARTOUT de la forme  <unite>-NNN<queue>  (décision de Jerry,
# 2026-08-05). Le numéro porte l'unicité — donc l'allocateur et son verrou sont
# nécessaires dans les trois ateliers. Ce qui suit le numéro diffère.
#
# colonnes
#   atelier      le nom court. « main » = ~/Recordings + ~/compositions (sans suffixe).
#                les autres  = ~/Recordings-<nom> + ~/compositions-<nom>.
#   unite        le préfixe numéroté : op, ep, jr. « ? » = non nommé.
#   portail      l'URL du Pixel Recorder qui sert cet atelier. « - » = aucun portail
#                — l'allocateur lit alors le disque et son registre, pas une API.
#   mode         OÙ tombe la ligne automatique/réveil :
#                  auto   = le crochet va jusqu'au bout, aucun réveil
#                  reveil = le crochet prépare, un agent juge
#                  revue  = mécanisé jusqu'au BROUILLON, réveil à la REVUE,
#                           publication après. C'est le flux rituel d'aureon
#                           (Réalisation → Brouillon → Revue → Publication) :
#                           la Revue appartient à Jerry.
#                  ?      = non tranché
#   destination  où l'action automatique republie. « - » = sans objet · « ? » = trou
#   sortie       ce qu'un dépôt OUVRE. « un dépôt → une composition » est faux en
#                général : piece · episode · journal (un contenant parmi
#                plusieurs, choisi par signature) · ? = non tranché
#   queue        ce qui suit le numéro. « -{slug} » = le portail dérive du titre.
#                Pour aureon (structure finale, Jerry 2026-08-05) :
#                  jr-NNN.{type}.{sujet}.v{yymmddhhmmss}
#                {type}  = main · white · aven · musc — AUCUNE MAJUSCULE dans
#                          l'identifiant : chaque segment est normalisé.
#                          Désabrégés par Jerry le 2026-08-05 ; « musc » reste
#                          le seul abrégé, non nommé dans cette passe.
#                {sujet} = le sujet abordé, minuscules-tirets sans accent — même
#                          normalisation que les slugs op-NNN existants
#                v{ts}   = horodatage UTC à la SECONDE, 12 chiffres. Deux
#                          versions d'une même entrée gardent la tête
#                          jr-NNN.{type}.{sujet} et changent de v ; une entrée
#                          différente prend un numéro neuf. « Ne jamais écraser
#                          une source sans garder la sortante » est portée par
#                          le nom lui-même.
#                Dans cet atelier c'est TOUJOURS Aureon qui écrit et Jerry qui
#                possède le journal : les segments {user} et {author} d'Edge Hub
#                n'ont plus d'objet.
#
# vérifié le 2026-08-05 : les six paires sur disque, les deux portails qui
# répondent (8768 → jamai, 4 compositions ; 8778 → episodes, 8 compositions),
# les unités existantes (op-001..op-003 dans jamai, ep-001..ep-008 dans episodes,
# aucune jr-NNN dans ~/compositions-aureon, qui est vide).
#
#atelier   unite  portail                  mode    destination  sortie    queue
jamai      op     https://localhost:8768   reveil  -            piece     -{slug}
episodes   ep     https://localhost:8778   auto    ?            episode   -{slug}
aureon     jr     https://localhost:8798                      revue*  ?            journal*  .{type}.{sujet}.v{ts}
nyro       ?      -                        ?       ?            ?         ?
synth      ?      -                        ?       ?            ?         ?
main       ?      -                        ?       ?            ?         ?
